[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "retryscope"
version = "1.0.0"
description = "Causal-witness migration audits for retry and timeout semantics"
requires-python = ">=3.11"
[project.scripts]
retryscope = "retryscope.cli:main"
retryscope-join = "retryscope.causal_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
